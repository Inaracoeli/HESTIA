# Vérification automatique à chaque envoi : types, tests du moteur, construction de l'app.
name: Vérification
on:
  push:
  pull_request:
jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/sync-fonctions.mjs --check
      - run: npm run build
